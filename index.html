
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QZIX COIN</title>
<style>
body{margin:0;background:#071426;color:#edf4ff;font:16px Arial;padding:20px}
.card{background:#10213a;padding:20px;border-radius:15px;margin:15px auto;max-width:500px}
input,button{padding:12px;border-radius:8px;margin:5px;border:1px solid #456;color:#fff;background:#09182a}
button{background:#66d9c3;color:#06221f;font-weight:bold}
#qrImage{background:white;padding:15px;display:inline-block;border-radius:10px;min-width:320px;min-height:320px}
#qrImage canvas,#qrImage img{width:320px!important;height:320px!important}
</style>
</head>
<body>
<h1>QZIX COIN</h1>
<div class="card">
<h2>QR Token Generator</h2>
<input id="tokenId" value="001" maxlength="3" inputmode="numeric">
<button id="generate">Generate QR</button>
<div id="qrImage"></div>
<p id="qrMessage"></p>
<button id="download">Download QR</button>
</div>
<div class="card">
<h2>Token Verification</h2>
<input id="verifyId" placeholder="Enter Token ID" maxlength="3">
<button id="verify">Verify Token</button>
<div id="result"></div>
</div>

<script>
const baseURL="https://pubggold970-cyber.github.io/qzixcoin.github.io/";

function cleanId(v){
 return String(v).trim().replace(/\D/g,"").padStart(3,"0");
}

function validId(id){
 return /^[0-9]{3}$/.test(id) && Number(id)>=1 && Number(id)<=100;
}

function tokenURL(id){
 return baseURL+"?token="+encodeURIComponent(id);
}

function verifyToken(id){
 const result=document.getElementById("result");
 if(!validId(id)){
  result.textContent="Invalid Token ID. Use 001 to 100.";
  return;
 }
 result.innerHTML="";
 const h=document.createElement("h3");
 h.textContent="✓ QZIX COIN Demo Record Found";
 const p=document.createElement("p");
 p.textContent="Token ID: "+id;
 const s=document.createElement("p");
 s.textContent="Status: Demo Record";
 const note=document.createElement("p");
 note.textContent="Legal ownership is not established. Demo only.";
 result.append(h,p,s,note);
}

async function loadQRLibrary(){
 if(window.QRCode)return true;
 const urls=[
 "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js",
 "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
 ];
 for(const url of urls){
  try{
   await new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=url;
    script.onload=resolve;
    script.onerror=reject;
    document.head.appendChild(script);
   });
   if(window.QRCode)return true;
  }catch(e){}
 }
 return false;
}

async function generateQR(){
 const id=cleanId(document.getElementById("tokenId").value);
 const box=document.getElementById("qrImage");
 const msg=document.getElementById("qrMessage");
 box.innerHTML="";
 if(!validId(id)){
  msg.textContent="Enter Token ID from 001 to 100.";
  return;
 }
 msg.textContent="Loading QR...";
 const loaded=await loadQRLibrary();
 if(!loaded){
  msg.textContent="QR library failed to load. Check internet and retry.";
  return;
 }
 new QRCode(box,{
  text:tokenURL(id),
  width:320,
  height:320,
  colorDark:"#000000",
  colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.H
 });
 msg.textContent="QR ready. Scan with Google Lens.";
 document.getElementById("tokenId").value=id;
}

document.getElementById("generate").addEventListener("click",generateQR);

document.getElementById("download").addEventListener("click",()=>{
 const canvas=document.querySelector("#qrImage canvas");
 const msg=document.getElementById("qrMessage");
 if(!canvas){
  msg.textContent="Generate QR first.";
  return;
 }
 try{
  const link=document.createElement("a");
  link.href=canvas.toDataURL("image/png");
  link.download="QZIX-COIN-"+cleanId(document.getElementById("tokenId").value)+".png";
  link.click();
  msg.textContent="QR download requested.";
 }catch(e){
  msg.textContent="Download failed. Long press QR image to save.";
 }
});

document.getElementById("verify").addEventListener("click",()=>{
 verifyToken(cleanId(document.getElementById("verifyId").value));
});

const params=new URLSearchParams(location.search);
const incoming=params.get("token");
if(incoming){
 const id=cleanId(incoming);
 document.getElementById("verifyId").value=id;
 verifyToken(id);
}else{
 generateQR();
}
</script>
</body>
</html>
