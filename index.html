
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QZIX COIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:#edf4ff;font:16px Arial;padding:20px}
main{max-width:600px;margin:auto}
.card{background:#10213a;border:1px solid #294361;border-radius:15px;padding:20px;margin:15px 0}
input,button{padding:13px;border-radius:9px;border:1px solid #456;font-size:16px;margin:5px 0}
input{background:#09182a;color:white;width:100%}
button{background:#66d9c3;color:#06221f;font-weight:bold;cursor:pointer}
#qrImage{background:#fff;padding:24px;border:4px solid white;border-radius:8px;width:max-content;max-width:100%;margin:15px auto;min-height:0}
#qrImage img,#qrImage canvas{display:block;max-width:100%;height:auto}
#result{overflow-wrap:anywhere}
.muted{color:#a9bad0;font-size:13px}
</style>
</head>
<body>
<main>
<h1>QZIX COIN</h1>
<p class="muted">100 Fixed Digital Token Demo</p>

<div class="card">
<h2>Generate Token QR</h2>
<input id="tokenId" value="001" maxlength="3" inputmode="numeric">
<button id="generate">Generate QR</button>
<div id="qrImage"></div>
<p id="message" class="muted"></p>
<button id="download">Download QR PNG</button>
</div>

<div class="card">
<h2>Token Verification</h2>
<input id="verifyId" placeholder="Enter Token ID 001–100" maxlength="3">
<button id="verify">Verify Token</button>
<div id="result"></div>
</div>

<div class="card">
<h2>Token Register</h2>
<p>Total Supply: 100</p>
<div id="tokenList"></div>
</div>

<p class="muted">Demo only. This page does not establish legal ownership, payments or investment rights.</p>
</main>

<script>
const SITE="https://pubggold970-cyber.github.io/qzixcoin.github.io/";
const qrBox=document.getElementById("qrImage");
const message=document.getElementById("message");

function cleanID(v){
 let n=String(v).trim().replace(/\D/g,"");
 return n.padStart(3,"0");
}
function validID(id){
 return /^\d{3}$/.test(id)&&Number(id)>=1&&Number(id)<=100;
}
function makeURL(id){
 return SITE+"?token="+id;
}
function verifyToken(id){
 const out=document.getElementById("result");
 out.innerHTML="";
 if(!validID(id)){
  out.textContent="Invalid Token. Use ID 001 to 100.";
  return;
 }
 const h=document.createElement("h3");
 h.textContent="✓ QZIX COIN Demo Record Found";
 const p=document.createElement("p");
 p.textContent="Token ID: "+id;
 const s=document.createElement("p");
 s.textContent="Status: Demo Record";
 const note=document.createElement("p");
 note.textContent="Legal ownership not established. Trading inactive.";
 out.append(h,p,s,note);
}

function loadScript(url){
 return new Promise((resolve,reject)=>{
  const s=document.createElement("script");
  s.src=url;
  s.onload=resolve;
  s.onerror=reject;
  document.head.appendChild(s);
 });
}
async function ensureQR(){
 if(window.QRCode)return true;
 const urls=[
 "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js",
 "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
 ];
 for(const url of urls){
  try{
   await loadScript(url);
   if(window.QRCode)return true;
  }catch(e){}
 }
 return false;
}
async function generateQR(){
 const id=cleanID(document.getElementById("tokenId").value);
 document.getElementById("tokenId").value=id;
 qrBox.innerHTML="";
 if(!validID(id)){
  message.textContent="Enter a valid ID from 001 to 100.";
  return;
 }
 message.textContent="Creating QR...";
 if(!await ensureQR()){
  message.textContent="Internet connection required to load QR generator.";
  return;
 }
 new QRCode(qrBox,{
  text:makeURL(id),
  width:400,
  height:400,
  colorDark:"#000000",
  colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.H
 });
 message.textContent="QR created. Scan using Google Lens.";
}
document.getElementById("generate").onclick=generateQR;

document.getElementById("download").onclick=()=>{
 const canvas=qrBox.querySelector("canvas");
 const img=qrBox.querySelector("img");
 let url="";
 if(canvas){
  url=canvas.toDataURL("image/png");
 }else if(img){
  url=img.src;
 }
 if(!url){
  message.textContent="Generate QR first.";
  return;
 }
 const a=document.createElement("a");
 a.href=url;
 a.download="QZIX-COIN-"+cleanID(document.getElementById("tokenId").value)+".png";
 document.body.appendChild(a);
 a.click();
 a.remove();
 message.textContent="Download requested. Check Downloads.";
};

document.getElementById("verify").onclick=()=>{
 verifyToken(cleanID(document.getElementById("verifyId").value));
};

const list=document.getElementById("tokenList");
for(let i=1;i<=100;i++){
 const id=String(i).padStart(3,"0");
 const b=document.createElement("button");
 b.textContent="Token "+id;
 b.onclick=()=>{
  document.getElementById("tokenId").value=id;
  generateQR();
  window.scrollTo({top:0,behavior:"smooth"});
 };
 list.appendChild(b);
}

const incoming=new URLSearchParams(location.search).get("token");
if(incoming){
 const id=cleanID(incoming);
 document.getElementById("verifyId").value=id;
 verifyToken(id);
}else{
 generateQR();
}
</script>
</body>
</html>
